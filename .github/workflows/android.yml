name: Build FastCharge Monitor APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract project ZIP
        run: |
          test -f FastChargePro.zip
          unzip -q FastChargePro.zip -d source
          test -f source/FastChargePro/app/build.gradle

      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/FastChargePro/app/build.gradle')
          s = p.read_text()
          if 'sourceCompatibility JavaVersion.VERSION_17' not in s:
              pos = s.rfind('\n}')
              if pos < 0:
                  raise SystemExit('Tidak menemukan penutup blok android di app/build.gradle')
              config = '''

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
              '''
              s = s[:pos] + config + s[pos:]
              p.write_text(s)
          print(p.read_text())
          PY

      - name: Build debug APK
        working-directory: source/FastChargePro
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: felix-apk
          path: source/FastChargePro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
