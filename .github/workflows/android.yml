name: Build APK & Register Device Serial

on:
  # Trigger build manual / push
  workflow_dispatch:
    inputs:
      device_serial:
        description: 'Nomor seri HP (opsional, untuk registrasi)'
        required: false
        type: string
  push:
    branches: [ main, master ]
  # Terima serial dari aplikasi HP
  repository_dispatch:
    types: [ register_device ]

permissions:
  contents: write   # wajib untuk update file daftar seri & release

jobs:
  build-and-register:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # 2. Setup Java 17
      # ─────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ─────────────────────────────────────────────
      # 3. Setup Gradle (cache)
      # ─────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ─────────────────────────────────────────────
      # 4. Setup Android SDK
      # ─────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # ─────────────────────────────────────────────
      # 5. AUTO-DETECT SOURCE (zip atau langsung)
      # ─────────────────────────────────────────────
      - name: Detect project source
        id: detect
        run: |
          echo "=== Cek sumber project ==="
          if [ -f "app/build.gradle" ]; then
            echo "✅ Mode: source langsung di repo"
            echo "PROJECT_DIR=$PWD" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -f "FastChargePro.zip" ]; then
            echo "✅ Mode: extract dari FastChargePro.zip"
            unzip -q FastChargePro.zip -d source
            ROOT_DIR=$(find source -maxdepth 3 -name "settings.gradle" -type f | head -n1 | xargs -r dirname)
            if [ -z "$ROOT_DIR" ]; then
              echo "❌ settings.gradle tidak ditemukan di dalam zip"; exit 1
            fi
            echo "PROJECT_DIR=$PWD/$ROOT_DIR" >> $GITHUB_OUTPUT
            ls -la "$ROOT_DIR"
            exit 0
          fi
          echo "❌ Tidak menemukan app/build.gradle maupun FastChargePro.zip"
          ls -la; exit 1

      # ─────────────────────────────────────────────
      # 6. Align Java 17 (compileOptions & kotlinOptions)
      # ─────────────────────────────────────────────
      - name: Align Java and Kotlin JVM targets
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          proj = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle"
          if not proj.exists(): raise SystemExit(f"❌ Tidak menemukan {proj}")
          s = proj.read_text()
          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              pos = s.rfind("\n}")
              config = """

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = '17' }
              """
              proj.write_text(s[:pos] + config + s[pos:])
              print("✅ compileOptions & kotlinOptions ditambahkan")
          else:
              print("✅ compileOptions sudah ada")
          PY

      # ─────────────────────────────────────────────
      # 7. Siapkan keystore (decode dari secret)
      # ─────────────────────────────────────────────
      - name: Prepare keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/myx.jks
          ls -la keystore/

      # ─────────────────────────────────────────────
      # 8. Build DEBUG (selalu)
      # ─────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon assembleDebug; else gradle --no-daemon assembleDebug; fi

      # ─────────────────────────────────────────────
      # 9. Build RELEASE (kalau keystore ada)
      # ─────────────────────────────────────────────
      - name: Build Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: ${{ steps.detect.outputs.PROJECT_DIR }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/myx.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f gradlew ]; then ./gradlew --no-daemon assembleRelease; else gradle --no-daemon assembleRelease; fi

      # ─────────────────────────────────────────────
      # 10. Upload Artifact DEBUG
      # ─────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FastChargePro-Debug
          path: ${{ steps.detect.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30   # ← BISA DIUBAH: 1–90 (public) / 1–400 (private)

      # ─────────────────────────────────────────────
      # 11. Upload Artifact RELEASE (kalau ada)
      # ─────────────────────────────────────────────
      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FastChargePro-Release
          path: ${{ steps.detect.outputs.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30   # ← BISA DIUBAH sesuai kebutuhan

      # ─────────────────────────────────────────────
      # 12. REGISTRASI SERI HP (cek tanpa API dulu)
      # ─────────────────────────────────────────────
      - name: Register device serial (no API first, then API)
        if: ${{ github.event.inputs.device_serial != '' || github.event.client_payload.device_serial != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERIAL: ${{ github.event.inputs.device_serial || github.event.client_payload.device_serial }}
        run: |
          set -e
          echo "📱 Serial yang dikirim: $SERIAL"
          SERIAL_FILE="device_serials.json"

          # ── LANGKAH A: CEK TANPA API (baca file dari repo) ──
          # File diambil dari checkout (langkah 1), bukan API
          if [ -f "$SERIAL_FILE" ]; then
            echo "📂 File $SERIAL_FILE ditemukan, membaca..."
            EXISTING=$(cat "$SERIAL_FILE")
          else
            echo "📂 File belum ada, akan dibuat baru."
            EXISTING='{"serials":[]}'
          fi

          # Cek duplikat: kalau serial sudah ada, keluar tanpa API
          if echo "$EXISTING" | grep -q "\"$SERIAL\""; then
            echo "✅ Serial $SERIAL SUDAH TERDAFTAR. Tidak ada perubahan."
            exit 0
          fi

          echo "🆕 Serial $SERIAL belum ada. Lanjut ke API..."

          # ── LANGKAH B: PAKAI API UNTUK UPDATE FILE ──
          # Ambil SHA file saat ini (wajib untuk update via API)
          if [ -f "$SERIAL_FILE" ]; then
            SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/contents/$SERIAL_FILE" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          else
            SHA=""
          fi

          # Tambah serial baru ke JSON (tanpa duplikat)
          NEW_JSON=$(python3 - <<PY
          import json
          data = json.loads('''$EXISTING''')
          serial = "$SERIAL"
          if serial not in data["serials"]:
              data["serials"].append(serial)
          print(json.dumps(data, indent=2))
          PY
          )

          # Encode base64 untuk API
          ENCODED=$(echo "$NEW_JSON" | base64 -w0)

          # Kirim PUT ke GitHub API
          if [ -n "$SHA" ]; then
            # Update file yang sudah ada
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/contents/$SERIAL_FILE" \
              -d "{\"message\":\"register device: $SERIAL\",\"content\":\"$ENCODED\",\"sha\":\"$SHA\"}"
          else
            # Buat file baru
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/contents/$SERIAL_FILE" \
              -d "{\"message\":\"register device: $SERIAL\",\"content\":\"$ENCODED\"}"
          fi

          echo "✅ Serial $SERIAL berhasil didaftarkan via API."

      # ─────────────────────────────────────────────
      # 13. Auto-release kalau push tag v*
      # ─────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && secrets.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.detect.outputs.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
