name: Build FastCharge Monitor APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract project ZIP
        run: |
          test -f FastChargeMonitor-Redmi-9A.zip
          unzip -q FastChargeMonitor-Redmi-9A.zip -d source
          test -f source/FastChargeMonitor/app/build.gradle

      - name: Build debug APK
        working-directory: source/FastChargeMonitor
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastChargeMonitor-debug-apk
          path: source/FastChargeMonitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
