name: Build APK & Register Device Serial

on:
  workflow_dispatch:
    inputs:
      device_serial:
        description: 'Nomor seri HP (opsional, untuk registrasi)'
        required: false
        type: string
  push:
    branches: [ main, master ]
  repository_dispatch:
    types: [ register_device ]

permissions:
  contents: write

jobs:
  build-and-register:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # 2. Setup Java 17
      # ─────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ─────────────────────────────────────────────
      # 3. Setup Gradle (cache)
      # ─────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ─────────────────────────────────────────────
      # 4. Setup Android SDK
      # ─────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # ─────────────────────────────────────────────
      # 5. AUTO-DETECT SOURCE (zip atau langsung)
      # ─────────────────────────────────────────────
      - name: Detect project source
        id: detect
        run: |
          echo "=== Cek sumber project ==="
          if [ -f "app/build.gradle" ]; then
            echo "✅ Mode: source langsung di repo"
            echo "PROJECT_DIR=$PWD" >> $GITHUB_OUTPUT
            echo "SOURCE_MODE=direct" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -f "FastChargePro.zip" ]; then
            echo "✅ Mode: extract dari FastChargePro.zip"
            unzip -q FastChargePro.zip -d source
            ROOT_DIR=$(find source -maxdepth 3 -name "settings.gradle" -type f | head -n1 | xargs -r dirname)
            if [ -z "$ROOT_DIR" ]; then
              echo "❌ settings.gradle tidak ditemukan di dalam zip"; exit 1
            fi
            echo "PROJECT_DIR=$PWD/$ROOT_DIR" >> $GITHUB_OUTPUT
            echo "SOURCE_MODE=zip" >> $GITHUB_OUTPUT
            ls -la "$ROOT_DIR"
            exit 0
          fi
          echo "❌ Tidak menemukan app/build.gradle maupun FastChargePro.zip"
          ls -la; exit 1

      # ─────────────────────────────────────────────
      # 6. AUTO-DETECT KEYSTORE
      #    Prioritas:
      #      1. Secret KEYSTORE_BASE64 (kalau di-set)
      #      2. File .jks di PROJECT_DIR/keystore/
      #      3. File .jks di PROJECT_DIR (root project)
      #      4. File .jks di root repo
      #    Kalau tidak ada sama sekali → set HAS_KEYSTORE=false
      # ─────────────────────────────────────────────
      - name: Auto-detect keystore
        id: keystore
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.PROJECT_DIR }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +e
          echo "=== Cek keberadaan keystore ==="

          # Prioritas 1: secret KEYSTORE_BASE64
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔑 Mode: dari secret KEYSTORE_BASE64"
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/myx.jks
            KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore/myx.jks"
            if [ -f "$KEYSTORE_PATH" ] && [ -s "$KEYSTORE_PATH" ]; then
              echo "✅ Keystore dari secret berhasil di-decode"
              echo "HAS_KEYSTORE=true" >> $GITHUB_OUTPUT
              echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_OUTPUT
              ls -la keystore/
              exit 0
            else
              echo "⚠️ Secret tidak valid, lanjut cek file lokal..."
            fi
          fi

          # Prioritas 2: file .jks di PROJECT_DIR/keystore/
          KEYSTORE_PATH=$(find "$PROJECT_DIR/keystore" -maxdepth 1 -name "*.jks" -type f 2>/dev/null | head -n1)
          if [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            echo "🔑 Mode: file .jks di $PROJECT_DIR/keystore/"
            echo "HAS_KEYSTORE=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_OUTPUT
            ls -la "$(dirname "$KEYSTORE_PATH")"
            exit 0
          fi

          # Prioritas 3: file .jks di PROJECT_DIR (root)
          KEYSTORE_PATH=$(find "$PROJECT_DIR" -maxdepth 1 -name "*.jks" -type f 2>/dev/null | head -n1)
          if [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            echo "🔑 Mode: file .jks di root project"
            echo "HAS_KEYSTORE=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Prioritas 4: file .jks di root repo (GITHUB_WORKSPACE)
          KEYSTORE_PATH=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name "*.jks" -type f 2>/dev/null | head -n1)
          if [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            echo "🔑 Mode: file .jks di root repo"
            echo "HAS_KEYSTORE=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Tidak ditemukan sama sekali
          echo "⚠️ Tidak ada keystore (.jks) ditemukan. Build release akan di-skip."
          echo "HAS_KEYSTORE=false" >> $GITHUB_OUTPUT
          exit 0

      # ─────────────────────────────────────────────
      # 7. Align Java 17 (compileOptions & kotlinOptions)
      # ─────────────────────────────────────────────
      - name: Align Java and Kotlin JVM targets
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          proj = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle"
          if not proj.exists(): raise SystemExit(f"❌ Tidak menemukan {proj}")
          s = proj.read_text()
          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              pos = s.rfind("\n}")
              config = """

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = '17' }
              """
              proj.write_text(s[:pos] + config + s[pos:])
              print("✅ compileOptions & kotlinOptions ditambahkan")
          else:
              print("✅ compileOptions sudah ada")
          PY

      # ─────────────────────────────────────────────
      # 8. Patch build.gradle supaya baca env KEYSTORE_FILE
      #    (hanya dijalankan kalau keystore ditemukan)
      # ─────────────────────────────────────────────
      - name: Patch build.gradle for keystore
        if: ${{ steps.keystore.outputs.HAS_KEYSTORE == 'true' }}
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          proj = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle"
          s = proj.read_text()

          # Kalau sudah pakai env KEYSTORE_FILE, skip
          if "System.getenv(\"KEYSTORE_FILE\")" in s or "System.getenv('KEYSTORE_FILE')" in s:
              print("✅ build.gradle sudah pakai env KEYSTORE_FILE")
              raise SystemExit(0)

          # Ganti blok signingConfigs release agar pakai env
          pattern = re.compile(
              r'signingConfigs\s*\{.*?release\s*\{.*?\}\s*\}',
              re.DOTALL
          )
          new_block = '''signingConfigs {
              release {
                  def keystorePath = System.getenv("KEYSTORE_FILE") ?: "${rootDir}/keystore/myx.jks"
                  storeFile file(keystorePath)
                  storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                  keyAlias System.getenv("KEY_ALIAS") ?: ""
                  keyPassword System.getenv("KEY_PASSWORD") ?: ""
              }
          }'''
          if pattern.search(s):
              s = pattern.sub(new_block, s, count=1)
              proj.write_text(s)
              print("✅ signingConfigs dipatch ke env KEYSTORE_FILE")
          else:
              print("⚠️ Tidak menemukan blok signingConfigs, cek manual")
          PY

      # ─────────────────────────────────────────────
      # 9. Build DEBUG (selalu)
      # ─────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon assembleDebug; else gradle --no-daemon assembleDebug; fi

      # ─────────────────────────────────────────────
      # 10. Build RELEASE (hanya kalau keystore ada)
      # ─────────────────────────────────────────────
      - name: Build Release APK
        if: ${{ steps.keystore.outputs.HAS_KEYSTORE == 'true' }}
        working-directory: ${{ steps.detect.outputs.PROJECT_DIR }}
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f gradlew ]; then ./gradlew --no-daemon assembleRelease; else gradle --no-daemon assembleRelease; fi

      # ─────────────────────────────────────────────
      # 11. Upload Artifact DEBUG (selalu)
      # ─────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FastChargePro-Debug
          path: ${{ steps.detect.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ─────────────────────────────────────────────
      # 12. Upload Artifact RELEASE (kalau keystore ada)
      # ─────────────────────────────────────────────
      - name: Upload Release APK
        if: ${{ steps.keystore.outputs.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FastChargePro-Release
          path: ${{ steps.detect.outputs.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ─────────────────────────────────────────────
      # 13. REGISTRASI SERI HP (cek tanpa API dulu)
      # ─────────────────────────────────────────────
      - name: Register device serial (no API first, then API)
        if: ${{ github.event.inputs.device_serial != '' || github.event.client_payload.device_serial != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERIAL: ${{ github.event.inputs.device_serial || github.event.client_payload.device_serial }}
        run: |
          set -e
          echo "📱 Serial yang dikirim: $SERIAL"
          SERIAL_FILE="device_serials.json"

          if [ -f "$SERIAL_FILE" ]; then
            echo "📂 File $SERIAL_FILE ditemukan, membaca..."
            EXISTING=$(cat "$SERIAL_FILE")
          else
            echo "📂 File belum ada, akan dibuat baru."
            EXISTING='{"serials":[]}'
          fi

          if echo "$EXISTING" | grep -q "\"$SERIAL\""; then
            echo "✅ Serial $SERIAL SUDAH TERDAFTAR. Tidak ada perubahan."
            exit 0
          fi

          echo "🆕 Serial $SERIAL belum ada. Lanjut ke API..."

          if [ -f "$SERIAL_FILE" ]; then
            SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/contents/$SERIAL_FILE" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          else
            SHA=""
          fi

          NEW_JSON=$(python3 - <<PY
          import json
          data = json.loads('''$EXISTING''')
          serial = "$SERIAL"
          if serial not in data["serials"]:
              data["serials"].append(serial)
          print(json.dumps(data, indent=2))
          PY
          )

          ENCODED=$(echo "$NEW_JSON" | base64 -w0)

          if [ -n "$SHA" ]; then
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/contents/$SERIAL_FILE" \
              -d "{\"message\":\"register device: $SERIAL\",\"content\":\"$ENCODED\",\"sha\":\"$SHA\"}"
          else
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/contents/$SERIAL_FILE" \
              -d "{\"message\":\"register device: $SERIAL\",\"content\":\"$ENCODED\"}"
          fi

          echo "✅ Serial $SERIAL berhasil didaftarkan via API."

      # ─────────────────────────────────────────────
      # 14. Auto-release kalau push tag v* DAN keystore ada
      # ─────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.detect.outputs.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
